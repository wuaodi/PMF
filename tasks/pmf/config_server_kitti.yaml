# common config
# save_path: "../../experiments/PMF-semantic-kitti-fov/"
save_path: "../../experiments/PMF-spacesense_136_sparse/"
seed: 1
#gpu: "0,1,2,3"  # 多卡配置（当前版本不支持）
gpu: "3"  # 使用GPU 2（H200）
print_frequency: 2
n_threads: 8  # 使用8个worker并行加载数据
experiment_id: "202601211000"

# data conifg
val_only: false
has_label: true
is_debug: false
n_epochs: 50
batch_size: [16, 8] # 显存足够，保持较大batch size
lr: 0.0001  # 大幅降低学习率，防止梯度爆炸和参数NaN
warmup_epochs: 1
momentum: 0.9
weight_decay: 0.00001
val_frequency: 1

dataset: "SemanticKitti"
nclasses: 8 # 7 real classes + 1 unlabeled (background)
data_root: "/data1/wuaodi_data/spacesense_136_sparse/sequences"
data_config: "../../pc_processor/dataset/semantic_kitti/spacesense_136_sparse.yaml"

base_channels: 32
img_backbone: "resnet34"
imagenet_pretrained: true

lambda: 1.0 # weight of lovasz-softmax loss
gamma: 0.5 # weight of perception-aware loss
tau: 0.7 # confidence threshold

# cehckpoint model
checkpoint: null
pretrained_model: null 

### data augmentation config ---------------------
augmentation:
  # flip
  p_flipx: 0.
  p_flipy: 0.5

  # translation
  p_transx: 0.5
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.5
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.5
  trans_zmin: -1
  trans_zmax: 0.

  # rotation
  p_rot_roll: 0.5
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.5
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.5
  rot_yawmin: 5
  rot_yawmax: -5

  # img jitter
  img_jitter: [0.4, 0.4, 0.4]

sensor:
  name: "HDL64"
  type: "perception-aware"
  # crop size of validation samples - 降低到512x512节省显存
  proj_h: 512
  proj_w: 512
  # crop size of training samples - 降低到512x512节省显存
  proj_ht: 512
  proj_wt: 512
  # 我的图像本来就能够被16整除，所以不需要padding
  h_pad: 0
  w_pad: 0

  img_mean:
    - 12.12
    - 10.88
    - 0.23
    - -1.04
    - 0.21
  img_stds:
    - 12.32
    - 11.47
    - 6.91
    - 0.86
    - 0.16  
post:
  KNN:
    use: false # This parameter default is false
    params:
      knn: 5
      search: 5
      sigma: 1.0
      cutoff: 1.0
