name: "kitti"
labels:
  0: "unlabeled"    # 投影图中没有点的位置
  1: "main_body"
  2: "solar_panel"
  3: "dish_antenna"
  4: "omni_antenna"
  5: "payload"
  6: "thruster"
color_map: # bgr
  0: [0, 0, 0]         # unlabeled (黑色，背景)
  1: [0, 255, 0]       # main_body
  2: [0, 0, 255]       # solar_panel
  3: [245, 150, 100]   # dish_antenna
  4: [0, 255, 255]     # omni_antenna
  5: [255, 255, 0]     # payload
  6: [255, 0, 255]     # thruster
content: # as a ratio with the total number of points
  0: 0.0   # unlabeled，不参与训练
  1: 0.5   # main_body
  2: 0.2   # solar_panel
  3: 0.1   # dish_antenna
  4: 0.1   # omni_antenna
  5: 0.05  # payload
  6: 0.05  # thruster
# classes that are indistinguishable from single scan or inconsistent in
# ground truth are mapped to their closest equivalent
learning_map:
  0: 0     # "unlabeled" 保持0
  1: 1     # "main_body" 恒等映射
  2: 2     # "solar_panel"
  3: 3     # "dish_antenna"
  4: 4     # "omni_antenna"
  5: 5     # "payload"
  6: 6     # "thruster"
learning_map_inv: # inverse of previous map
  0: 0     # "unlabeled"
  1: 1     # "main_body"
  2: 2     # "solar_panel"
  3: 3     # "dish_antenna"
  4: 4     # "omni_antenna"
  5: 5     # "payload"
  6: 6     # "thruster"
learning_ignore: # Ignore classes
  0: true  # 忽略unlabeled（投影图中没有点的位置）
  1: false # "main_body"
  2: false # "solar_panel"
  3: false # "dish_antenna"
  4: false # "omni_antenna"
  5: false # "payload"
  6: false # "thruster"
split: # sequence numbers
  train:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
  valid:
    - 6
    - 7
  test:
    - 8
    - 9
    
mapped_class_name:
  0: "unlabeled"
  1: "main_body"
  2: "solar_panel"   
  3: "dish_antenna"
  4: "omni_antenna"
  5: "payload"
  6: "thruster"

color_map_inv: # bgr
  0: [0, 0, 0]         # unlabeled (黑色)
  1: [0, 255, 0]       # main_body
  2: [0, 0, 255]       # solar_panel
  3: [245, 150, 100]   # dish_antenna
  4: [0, 255, 255]     # omni_antenna
  5: [255, 255, 0]     # payload
  6: [255, 0, 255]     # thruster
